<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Culture del Racconto nel Mondo — Indice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #0e0c0a;
  --surface:    #161410;
  --surface2:   #1e1b17;
  --border:     rgba(255,255,255,0.07);
  --text:       #e8e0d4;
  --text-dim:   rgba(232,224,212,0.55);
  --text-dimmer:rgba(232,224,212,0.28);

  --west:    #c8864a;
  --africa:  #d4784a;
  --japan:   #9b7fd4;
  --india:   #d4a84a;
  --indigen: #5aab7a;
  --arabic:  #4a9abd;
  --china:   #c84a6a;
  --norse:   #7aabd4;
  --greek:   #c8be3a;

  --gold:     #c8a04a;
  --gold-dim: rgba(200,160,74,0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ── SFONDO STELLATO ── */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.star {
  position: absolute;
  width: 1.5px; height: 1.5px;
  background: rgba(232,224,212,0.5);
  border-radius: 50%;
  animation: twinkle var(--d, 4s) var(--delay, 0s) infinite ease-in-out;
}
@keyframes twinkle {
  0%,100% { opacity: 0.15; transform: scale(1); }
  50%      { opacity: 0.75; transform: scale(1.4); }
}

/* ── LAYOUT ── */
.page {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── HEADER ── */
header {
  padding: 72px 0 56px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  margin-bottom: 56px;
}

.header-eyebrow {
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
  opacity: 0.85;
}

header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 300;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 14px;
  letter-spacing: 0.01em;
}

header h1 em {
  font-style: italic;
  color: var(--gold);
}

header p {
  font-size: 13.5px;
  color: var(--text-dim);
  max-width: 460px;
  margin: 0 auto 28px;
  font-weight: 300;
}

.header-divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 0 auto;
  opacity: 0.4;
}

/* ── BADGE TIPI ── */
.tipo-legenda {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 16px;
  margin-bottom: 52px;
}

.tipo-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}

.tipo-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-cultura  { background: #a0a0b8; }
.dot-storie   { background: var(--gold); }
.dot-bambini  { background: #7abf9a; }
.dot-guida    { background: #bf9a7a; }

/* ── CARD PANORAMICO ── */
.panoramico-wrap {
  margin-bottom: 52px;
}

.panoramico-label {
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 10px;
  opacity: 0.7;
}

.panoramico-card {
  display: flex;
  align-items: center;
  gap: 20px;
  background: var(--gold-dim);
  border: 1px solid rgba(200,160,74,0.22);
  border-radius: 4px;
  padding: 20px 24px;
  text-decoration: none;
  color: var(--text);
  transition: background 0.25s, border-color 0.25s;
}

.panoramico-card:hover {
  background: rgba(200,160,74,0.22);
  border-color: rgba(200,160,74,0.4);
}

.panoramico-icon {
  font-size: 22px;
  flex-shrink: 0;
  opacity: 0.8;
}

.panoramico-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.15rem;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.panoramico-card small {
  display: block;
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 2px;
  font-weight: 300;
}

/* ── SEZIONE CULTURE ── */
.culture-label {
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  margin-bottom: 20px;
}

.culture-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ── CULTURA CARD ── */
.cultura-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.cultura-card:hover {
  border-color: rgba(255,255,255,0.13);
}

.cultura-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  cursor: pointer;
  user-select: none;
  gap: 12px;
}

.cultura-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.cultura-accent {
  width: 3px;
  border-radius: 2px;
  height: 28px;
  flex-shrink: 0;
}

.cultura-nome {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.02em;
}

.cultura-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.cultura-progress {
  font-size: 10.5px;
  color: var(--text-dimmer);
  font-weight: 400;
}

.cultura-chevron {
  width: 14px; height: 14px;
  opacity: 0.35;
  transition: transform 0.25s, opacity 0.2s;
  flex-shrink: 0;
}

.cultura-card.open .cultura-chevron {
  transform: rotate(180deg);
  opacity: 0.6;
}

/* ── DOCUMENTI ── */
.documenti-list {
  display: none;
  border-top: 1px solid var(--border);
}

.cultura-card.open .documenti-list {
  display: block;
}

.doc-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 20px 11px 35px;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  color: var(--text);
  transition: background 0.18s;
}

.doc-row:last-child {
  border-bottom: none;
}

.doc-row:hover:not(.non-disponibile) {
  background: var(--surface2);
}

.doc-row.non-disponibile {
  cursor: default;
  pointer-events: none;
}

.doc-indicatore {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.doc-row.non-disponibile .doc-indicatore {
  opacity: 0.2;
}

.doc-titolo {
  font-size: 13px;
  font-weight: 400;
  flex: 1;
}

.doc-row.non-disponibile .doc-titolo {
  color: var(--text-dimmer);
}

.doc-tag-prossimo {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 2px 7px;
}

.doc-arrow {
  font-size: 11px;
  color: var(--text-dimmer);
  opacity: 0;
  transition: opacity 0.15s, transform 0.15s;
}

.doc-row:hover:not(.non-disponibile) .doc-arrow {
  opacity: 1;
  transform: translateX(2px);
}

/* ── LOADING / ERROR ── */
.status-msg {
  text-align: center;
  padding: 60px 0;
  color: var(--text-dimmer);
  font-size: 13px;
  font-style: italic;
}

/* ── FOOTER ── */
footer {
  margin-top: 72px;
  padding-top: 28px;
  border-top: 1px solid var(--border);
  text-align: center;
}

footer p {
  font-size: 11px;
  color: var(--text-dimmer);
  letter-spacing: 0.05em;
}

/* ── RESPONSIVE ── */
@media (max-width: 500px) {
  .page { padding: 0 16px 60px; }
  header { padding: 48px 0 40px; }
  .panoramico-card { flex-direction: column; align-items: flex-start; gap: 10px; }
  .tipo-legenda { gap: 6px 12px; }
  .doc-row { padding-left: 20px; }
}
</style>
</head>
<body>

<!-- Stelle di sfondo -->
<div class="stars" id="stars"></div>

<div class="page">

  <header>
    <p class="header-eyebrow">Atlante delle Narrazioni</p>
    <h1>Le Culture del Racconto<br><em>nel Mondo</em></h1>
    <p>Un viaggio attraverso le tradizioni narrative dell'umanità — strutture, visioni del tempo, insegnamenti.</p>
    <div class="header-divider"></div>
  </header>

  <div id="app">
    <p class="status-msg">Caricamento in corso…</p>
  </div>

  <footer>
    <p>37 report · 9 culture · 1 prospettiva panoramica</p>
  </footer>

</div>

<script>
// ── Stelle ──────────────────────────────────────────────
(function() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random()*100}%;
      top:  ${Math.random()*100}%;
      --d:  ${(Math.random()*4+2).toFixed(1)}s;
      --delay: ${(Math.random()*5).toFixed(1)}s;
    `;
    container.appendChild(s);
  }
})();

// ── Colori per tipo documento ──────────────────────────
const TIPO_CONFIG = {
  cultura:  { dot: 'dot-cultura',  label: 'La Cultura'            },
  storie:   { dot: 'dot-storie',   label: 'Le Storie Classiche'   },
  bambini:  { dot: 'dot-bambini',  label: 'La Storia per Bambini' },
  guida:    { dot: 'dot-guida',    label: 'La Guida Pratica'      },
};

// ── Render ─────────────────────────────────────────────
function render(data) {
  const app = document.getElementById('app');
  const { panoramico, culture } = data;

  let html = '';

  // Legenda tipi
  html += `<div class="tipo-legenda">`;
  for (const [key, cfg] of Object.entries(TIPO_CONFIG)) {
    html += `
      <span class="tipo-badge">
        <span class="tipo-dot ${cfg.dot}"></span>
        ${cfg.label}
      </span>`;
  }
  html += `</div>`;

  // Card panoramico
  if (panoramico) {
    const tag = panoramico.disponibile
      ? `<a href="${panoramico.link}" class="panoramico-card">`
      : `<div class="panoramico-card" style="pointer-events:none;opacity:0.5;">`;
    const close = panoramico.disponibile ? `</a>` : `</div>`;

    html += `
      <div class="panoramico-wrap">
        <p class="panoramico-label">Report Introduttivo</p>
        ${tag}
          <span class="panoramico-icon">◎</span>
          <div>
            <h2>${panoramico.titolo}</h2>
            <small>${panoramico.descrizione}</small>
          </div>
          ${panoramico.disponibile ? '<span style="margin-left:auto;font-size:13px;opacity:0.4;">→</span>' : ''}
        ${close}
      </div>`;
  }

  // Culture
  html += `<p class="culture-label">Le Culture</p>`;
  html += `<div class="culture-list">`;

  culture.forEach((cultura, idx) => {
    const disponibili = cultura.documenti.filter(d => d.disponibile).length;
    const totale = cultura.documenti.length;
    const isOpen = disponibili === totale; // aperta di default se completa

    html += `
      <div class="cultura-card${isOpen ? ' open' : ''}" id="card-${cultura.id}">
        <div class="cultura-header" onclick="toggleCard('card-${cultura.id}')">
          <div class="cultura-header-left">
            <div class="cultura-accent" style="background: var(--${cultura.colore})"></div>
            <span class="cultura-nome">${cultura.nome}</span>
          </div>
          <div class="cultura-meta">
            <span class="cultura-progress">${disponibili}/${totale}</span>
            <svg class="cultura-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
        <div class="documenti-list">`;

    cultura.documenti.forEach(doc => {
      const cfg = TIPO_CONFIG[doc.tipo] || {};
      if (doc.disponibile) {
        html += `
          <a href="${doc.link}" class="doc-row">
            <span class="doc-indicatore ${cfg.dot}"></span>
            <span class="doc-titolo">${doc.titolo}</span>
            <span class="doc-arrow">→</span>
          </a>`;
      } else {
        html += `
          <div class="doc-row non-disponibile">
            <span class="doc-indicatore ${cfg.dot}"></span>
            <span class="doc-titolo">${doc.titolo}</span>
            <span class="doc-tag-prossimo">prossimamente</span>
          </div>`;
      }
    });

    html += `</div></div>`; // documenti-list, cultura-card
  });

  html += `</div>`; // culture-list
  app.innerHTML = html;
}

// ── Toggle accordion ───────────────────────────────────
function toggleCard(id) {
  document.getElementById(id).classList.toggle('open');
}

// ── Fetch JSON ─────────────────────────────────────────
fetch('reports.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(data => render(data))
  .catch(() => {
    document.getElementById('app').innerHTML = `
      <p class="status-msg">
        Il file <code>reports.json</code> non è ancora disponibile.<br>
        La pagina è pronta: aggiungi il JSON nella stessa directory per visualizzare i report.
      </p>`;
  });
</script>
</body>
</html>
